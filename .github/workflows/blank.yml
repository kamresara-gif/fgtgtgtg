name: Build Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y make
          make package

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: mod-package
          path: packages/*.deb
